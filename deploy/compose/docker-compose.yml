# vlr-main-agent control-plane stack.
#
# Data lives in BIND MOUNTS under ./data at the repo root (../../data here), so it
# is in a path you control and SURVIVES `docker compose down` — only `down -v`
# plus deleting ./data removes it. The agent container runs non-root (distroless
# uid 65532). Run from this directory: `docker compose up -d --build`.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vlr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vlr}
      # Keep PGDATA in a subdir so the bind-mount root can hold lost+found etc.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ../../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vlr} -d ${POSTGRES_DB:-vlr}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published to the host by default — only the agent reaches it over the
    # compose network. Uncomment to inspect from the host.
    # ports: ["127.0.0.1:5432:5432"]

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - ../../data/clickhouse:/var/lib/clickhouse
      - ../../data/clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget -nv -t1 -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    # ports: ["127.0.0.1:8123:8123", "127.0.0.1:9000:9000"]

  agent:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        # Set GO_BUILD_PAR=1 in the environment on a low-RAM VPS to cap the Go
        # build parallelism and avoid swap-thrash/OOM during the compile.
        GO_BUILD_PAR: ${GO_BUILD_PAR:-0}
    image: vlr-main-agent:latest
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    environment:
      AGENT_LISTEN: 0.0.0.0:8443
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:?set AGENT_API_TOKEN in .env}
      POSTGRES_DSN: postgres://${POSTGRES_USER:-vlr}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vlr}?sslmode=disable
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-vlr}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      PULL_THRESHOLD_BYTES: ${PULL_THRESHOLD_BYTES:-268435456}
      RECONCILE_SECONDS: ${RECONCILE_SECONDS:-600}
      DOWN_AFTER_MISSES: ${DOWN_AFTER_MISSES:-3}
      NODE_CA_FILE: ${NODE_CA_FILE:-}
      NODE_TLS_INSECURE: ${NODE_TLS_INSECURE:-0}
      AGENT_SUB_TITLE: ${AGENT_SUB_TITLE:-}
      AGENT_SUB_UPDATE_HOURS: ${AGENT_SUB_UPDATE_HOURS:-12}
      AGENT_SUB_SUPPORT_URL: ${AGENT_SUB_SUPPORT_URL:-}
      # Self-service portal (GET /me behind Authentik forward-auth) + auto-revoke
      # webhook. Portal is on only when PUBLIC_SUB_BASE and PORTAL_NODE_IDS (or legacy PORTAL_NODE_ID) are set.
      PUBLIC_SUB_BASE: ${PUBLIC_SUB_BASE:-}
      PORTAL_NODE_ID: ${PORTAL_NODE_ID:-}
      PORTAL_NODE_IDS: ${PORTAL_NODE_IDS:-}
      PORTAL_HEADER: ${PORTAL_HEADER:-X-Authentik-Email}
      PORTAL_PROFILE: ${PORTAL_PROFILE:-}
      AUTHENTIK_WEBHOOK_SECRET: ${AUTHENTIK_WEBHOOK_SECRET:-}
    # Bind the raw agent API to localhost only — it must sit behind TLS (the
    # bundled caddy / the portal Caddy), never be exposed on 0.0.0.0. A fronting
    # proxy reaches it over the compose network as agent:8443 regardless.
    ports:
      - "127.0.0.1:${AGENT_PORT:-8443}:8443"

  # TLS terminator (opt-in): `docker compose --profile tls up -d`. Put a real
  # domain in AGENT_DOMAIN (.env) so Caddy fetches a Let's Encrypt cert; it then
  # proxies HTTPS -> agent:8443. Without it the agent is plain HTTP — never expose
  # :8443 to the internet directly.
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on: [agent]
    environment:
      AGENT_DOMAIN: ${AGENT_DOMAIN:-localhost}
      # Serve HTTPS here. Set to a free port (e.g. 9443) when 443 is taken on the
      # host; ACME still validates over port 80.
      AGENT_HTTPS_PORT: ${AGENT_HTTPS_PORT:-443}
    ports:
      - "80:80"
      - "${AGENT_HTTPS_PORT:-443}:${AGENT_HTTPS_PORT:-443}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../data/caddy:/data
      - ../../data/caddy-config:/config

  # Telegram subscription-gate bot (../../bot). Gates VPN access on channel
  # membership: subscribed -> issues a /sub link via the agent API; left -> revokes.
  # Shares one SQLite ledger volume with its worker.
  bot:
    build:
      context: ../../bot
      dockerfile: Dockerfile
    image: vlr-main-bot:latest
    profiles: ["bot"] # opt-in: `docker compose --profile bot up -d` (needs BOT_TOKEN etc)
    restart: unless-stopped
    command: ["python", "-m", "app.bot"]
    depends_on: [agent]
    # NOTE: these use ${VAR:-} (not ${VAR:?}) on purpose. Compose interpolates the
    # WHOLE file before applying profiles, so a required (:?) var here would block
    # `up` even when the bot profile is off. Fill them in .env before running the
    # bot with `--profile bot`; the bot validates them itself at startup.
    environment: &bot_env
      BOT_TOKEN: ${BOT_TOKEN:-}
      CHANNEL: ${CHANNEL:-}
      CHANNEL_INVITE: ${CHANNEL_INVITE:-https://t.me/your_channel}
      AGENT_URL: ${AGENT_URL:-http://agent:8443}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN}
      NODE_ID: ${NODE_ID:-}
      PUBLIC_SUB_BASE: ${PUBLIC_SUB_BASE:-}
      SUB_EXPIRES_IN: ${SUB_EXPIRES_IN:-}
      SUB_LABEL: ${SUB_LABEL:-}
      SUB_TITLE: ${SUB_TITLE:-}
      DATABASE_URL: sqlite+aiosqlite:////data/bot.db
      SWEEP_INTERVAL_SECONDS: ${SWEEP_INTERVAL_SECONDS:-600}
    volumes:
      - ../../data/bot:/data

  # Reconciliation worker — periodically re-checks membership and revokes leavers
  # the realtime chat_member update may have missed (restart, dropped update).
  worker:
    image: vlr-main-bot:latest
    profiles: ["bot"] # opt-in with the bot profile
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on: [agent, bot]
    environment: *bot_env
    volumes:
      - ../../data/bot:/data

# Portal overlay: adds the Authentik-gated portal + subscription front (Caddy with
# Caddyfile.portal) and stops publishing the agent's raw :8443 to the world.
#
# Bring the whole control plane up WITH the portal:
#   docker compose -f docker-compose.yml -f docker-compose.portal.yml up -d
#
# (postgres + clickhouse + agent + portal. The base `caddy` and `bot` services stay
# off — they are behind their own profiles.)
#
# Needs in .env: PORTAL_DOMAIN, AUTHENTIK_HOST, PUBLIC_SUB_BASE, PORTAL_NODE_ID,
# AUTHENTIK_WEBHOOK_SECRET (see .env.example).

services:
  # The base compose already binds the agent to 127.0.0.1 only; the portal Caddy
  # reaches it over the compose network as agent:8443. Nothing to override here —
  # do NOT re-declare agent ports (compose MERGES port lists, causing a double bind).

  # Dedicated Authentik proxy outpost. Connects OUTBOUND to Authentik with its
  # token, pulls the provider config, and answers the local forward_auth on :9000.
  # This is what makes cross-host SSO reliable (no header mangling via EDGE Caddy).
  ak-proxy:
    image: ghcr.io/goauthentik/proxy:${AUTHENTIK_TAG:-2026.5.4}
    restart: unless-stopped
    environment:
      AUTHENTIK_HOST: ${AUTHENTIK_URL:-https://auth.genomed-security.ru}
      AUTHENTIK_INSECURE: "false"
      AUTHENTIK_TOKEN: ${AK_OUTPOST_TOKEN:?set AK_OUTPOST_TOKEN in .env}

  portal:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [agent, ak-proxy]
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?set PORTAL_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.portal:/etc/caddy/Caddyfile:ro
      - ../../data/portal-caddy:/data
      - ../../data/portal-caddy-config:/config
